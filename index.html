<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIC Benefit Illustration Slide Presenter</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PptxGenJS -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptx.bundle.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #slides-wrapper, #slides-wrapper * { visibility: visible; }
      #slides-wrapper { position: absolute; left: 0; top: 0; width: 100%; }
      .slide-card { page-break-after: always; min-height: 100vh; box-shadow: none !important; margin-bottom: 0 !important; }
      .no-print { display: none !important; }
    }
    .slide-card { aspect-ratio: 16 / 9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

  <!-- Header -->
  <header class="bg-blue-900 text-white shadow-md no-print sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-400 text-blue-950 p-2 rounded-lg font-black text-xl tracking-wider">LIC</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Policy Presentation Maker</h1>
          <p class="text-xs text-blue-200">Guaranteed Benefit Illustration Slides</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <button id="langToggleBtn" onclick="toggleLanguage()" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-md text-sm border border-blue-600 flex items-center gap-2">
          <i data-lucide="languages" class="w-4 h-4 text-amber-300"></i>
          <span id="currentLangLabel">भाषा: मराठी</span>
        </button>

        <button onclick="downloadPPTX()" id="exportPptxBtn" class="bg-amber-500 hover:bg-amber-400 text-blue-950 font-semibold px-3 py-1.5 rounded-md text-sm flex items-center gap-2">
          <i data-lucide="file-presentation" class="w-4 h-4"></i>
          <span>PPTX डाऊनलोड</span>
        </button>

        <button onclick="window.print()" id="printPdfBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded-md text-sm flex items-center gap-2">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>प्रिंट / PDF</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Upload and Review Section -->
    <section class="bg-white rounded-xl shadow border border-slate-200 p-6 no-print">
      <h2 class="text-lg font-bold text-blue-950 flex items-center gap-2 mb-4">
        <i data-lucide="file-up" class="w-5 h-5 text-amber-500"></i>
        <span>१. बेनिफिट इलस्ट्रेशन PDF अपलोड करा आणि माहिती तपासा</span>
      </h2>

      <div class="border-2 border-dashed border-blue-300 rounded-lg p-6 text-center bg-blue-50/50 hover:bg-blue-50 transition mb-6">
        <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden" onchange="handleFileUpload(event)">
        <label for="pdfFileInput" class="cursor-pointer flex flex-col items-center">
          <i data-lucide="upload-cloud" class="w-12 h-12 text-blue-600 mb-2"></i>
          <span class="text-sm font-semibold text-blue-900">PDF फाईल निवडण्यासाठी येथे क्लिक करा</span>
          <span class="text-xs text-slate-500 mt-1">LIC Benefit Illustration PDF</span>
        </label>
        <div id="parseStatus" class="text-xs font-semibold text-blue-700 mt-2 hidden"></div>
      </div>

      <form id="reviewForm" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 text-sm" onsubmit="event.preventDefault(); renderSlides();">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">प्लॅनचे नाव</label>
          <input type="text" id="field_planName" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">क्लायंटचे नाव</label>
          <input type="text" id="field_clientName" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">वय (वर्षे)</label>
          <input type="text" id="field_age" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">टर्म / पीपीटी</label>
          <input type="text" id="field_terms" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">प्रीमियम</label>
          <input type="text" id="field_premium" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">सम ॲश्युअर्ड</label>
          <input type="text" id="field_sumAssured" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">गॅरंटीड रेग्युलर इन्कम</label>
          <input type="text" id="field_regularIncome" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">गॅरंटीड ॲडिशन्स (GA)</label>
          <input type="text" id="field_ga" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">मॅच्युरिटी बेनिफिट</label>
          <input type="text" id="field_maturity" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">डेथ बेनिफिट (Life Cover)</label>
          <input type="text" id="field_deathCover" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">सल्लागार / एजन्सी नाव</label>
          <input type="text" id="field_advisorName" class="w-full border rounded px-3 py-1.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">एजन्सी कोड</label>
          <input type="text" id="field_advisorCode" class="w-full border rounded px-3 py-1.5">
        </div>

        <div class="md:col-span-3 lg:col-span-4 flex justify-end mt-2">
          <button type="submit" class="bg-blue-900 hover:bg-blue-800 text-white font-semibold px-6 py-2 rounded-lg flex items-center gap-2">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            <span>स्लाईड्स अपडेट करा</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Slides Display -->
    <section id="slides-container" class="space-y-6">
      <div id="slides-wrapper" class="flex flex-col gap-8 items-center"></div>
    </section>

  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    
    let currentLang = 'mr';
    let policyData = {
      planName: "LIC's Jeevan Utsav - Single Premium (Plan No. 883)",
      clientName: "Navin Harilal Parakh",
      age: "54",
      terms: "Policy Term: 46 Years | PPT: 1 Year (Single)",
      premium: "₹ 4,94,850",
      sumAssured: "₹ 5,00,000",
      regularIncome: "₹ 50,000 दरवर्षी (आजीवन)",
      ga: "₹ 1,40,000 (गॅरंटीड ॲडिशन्स जमा)",
      maturity: "₹ 7,58,563 (वयाच्या १०० व्या वर्षी)",
      deathCover: "₹ 6,38,563 ते ₹ 7,58,563",
      surrenderValue: "₹ 4,47,876 ते ₹ 7,01,742 पर्यंत उपलब्ध",
      advisorName: "MR. NAVIN H. PARAKH",
      advisorCode: "Agency Code: 1088995L"
    };

    const i18n = {
      mr: {
        coverSubtitle: "विशेष हमखास परतावा व आजीवन उत्पन्न योजना",
        presentedFor: "सादरकर्ता / क्लायंट:",
        advisorLabel: "विमा सल्लागार:",
        slide2Title: "प्लॅनची मुख्य वैशिष्ट्ये (Plan Highlights)",
        slide2Sub: "१००% हमखास फायदे आणि संपूर्ण आर्थिक सुरक्षा",
        singleInvestment: "एकवेळ गुंतवणूक (Single Premium)",
        guaranteedIncome: "आजीवन गॅरंटीड उत्पन्न (Regular Income)",
        gaBenefit: "गॅरंटीड ॲडिशन्स (GA)",
        lifeProtection: "सुरक्षा कवच (Life Cover)",
        slide3Title: "कॅश फ्लो आणि हमखास उत्पन्न (Cash Flow)",
        slide3Sub: "नियमित खात्रीशीर उत्पन्न आणि अंतिम मॅच्युरिटी लाभ",
        incomeTimeline: "उत्पन्न सुरू: दरवर्षी अखंड खात्यात जमा",
        maturityHeading: "अंतिम मॅच्युरिटी बेनिफिट (वयाच्या १०० व्या वर्षी):",
        slide4Title: "सुरक्षा कवच आणि तरलता (Protection & Liquidity)",
        slide4Sub: "वाढते डेथ कव्हर आणि आपत्कालीन सरेंडर मूल्य",
        deathBenefitHeading: "डेथ बेनिफिट (Life Cover):",
        deathBenefitDesc: "पॉलिसी सुरू झाल्यापासून रिस्क कव्हर त्वरित लागू होते आणि ॲडिशन्ससह वाढत राहते.",
        surrenderHeading: "सरेंडर व्हॅल्यू (Surrender Value):",
        surrenderDesc: "गरजेच्या वेळी पॉलिसीवर कर्ज किंवा सरेंडर सुविधा उपलब्ध राहते."
      },
      en: {
        coverSubtitle: "Guaranteed Return & Lifetime Income Presentation",
        presentedFor: "Prepared Exclusively For:",
        advisorLabel: "Financial Advisor:",
        slide2Title: "Key Plan Highlights",
        slide2Sub: "100% Guaranteed Benefits and Lifetime Security",
        singleInvestment: "One-Time Investment (Single Premium)",
        guaranteedIncome: "Guaranteed Lifetime Annual Income",
        gaBenefit: "Guaranteed Additions (GA)",
        lifeProtection: "Total Protection (Life Cover)",
        slide3Title: "Guaranteed Cash Flow & Returns",
        slide3Sub: "Regular stream of assured income & maturity value",
        incomeTimeline: "Income Starts: Guaranteed annual payout",
        maturityHeading: "Final Guaranteed Maturity (at Age 100):",
        slide4Title: "Financial Protection & Liquidity",
        slide4Sub: "Increasing Death Cover and Surrender Liquidity",
        deathBenefitHeading: "Death Benefit (Life Cover):",
        deathBenefitDesc: "High immediate insurance cover with guaranteed additions.",
        surrenderHeading: "Surrender Value & Loan:",
        surrenderDesc: "Access to loan and guaranteed liquidity anytime during the term."
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'mr' ? 'en' : 'mr';
      document.getElementById('currentLangLabel').innerText = currentLang === 'mr' ? 'भाषा: मराठी' : 'Language: English';
      renderSlides();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('parseStatus');
      status.classList.remove('hidden');
      status.innerText = "PDF स्कॅन करत आहे, कृपया थांबा...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        let fullText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageStrings = textContent.items.map(item => item.str);
          fullText += " " + pageStrings.join(" ");
        }

        extractDataFromText(fullText);
        status.innerText = "माहिती यशस्वीरित्या वाचली गेली!";
      } catch (err) {
        console.error(err);
        status.innerText = "PDF वाचताना अडचण आली. माहिती मॅन्युअली भरा.";
      }
    }

    function extractDataFromText(text) {
      if (text.includes("Jeevan Utsav")) {
        policyData.planName = "LIC's Jeevan Utsav - Single Premium (Plan 883)";
      }
      const nameMatch = text.match(/Name of\s*(?:prospect\/policyholder|life assured)\s*\|\s*([A-Za-z\s]+?)(?=\||Age)/i);
      if (nameMatch && nameMatch[1]) policyData.clientName = nameMatch[1].trim();

      const ageMatch = text.match(/Age of\s*(?:prospect\/policyholder|life assured)\s*\|\s*(\d+)/i);
      if (ageMatch) policyData.age = ageMatch[1];

      const premMatch = text.match(/Single premium\s*\|\s*([\d,]+\.?\d*)/i);
      if (premMatch) policyData.premium = "₹ " + premMatch[1];

      const saMatch = text.match(/Basic sum assured Rs\.\s*\|\s*([\d,]+)/i);
      if (saMatch) policyData.sumAssured = "₹ " + saMatch[1];

      const incomeMatch = text.match(/50000|40000|60000|100000/);
      if (incomeMatch) policyData.regularIncome = "₹ " + incomeMatch[0] + " दरवर्षी (आजीवन)";

      const agencyMatch = text.match(/Agency name\s*\|\s*([A-Za-z\.\s]+?)(?=\||Agency code)/i);
      if (agencyMatch) policyData.advisorName = agencyMatch[1].trim();

      const codeMatch = text.match(/Agency code\s*\|\s*([A-Z0-9]+)/i);
      if (codeMatch) policyData.advisorCode = "Agency Code: " + codeMatch[1].trim();

      fillFormWithData();
      renderSlides();
    }

    function fillFormWithData() {
      document.getElementById('field_planName').value = policyData.planName;
      document.getElementById('field_clientName').value = policyData.clientName;
      document.getElementById('field_age').value = policyData.age;
      document.getElementById('field_terms').value = policyData.terms;
      document.getElementById('field_premium').value = policyData.premium;
      document.getElementById('field_sumAssured').value = policyData.sumAssured;
      document.getElementById('field_regularIncome').value = policyData.regularIncome;
      document.getElementById('field_ga').value = policyData.ga;
      document.getElementById('field_maturity').value = policyData.maturity;
      document.getElementById('field_deathCover').value = policyData.deathCover;
      document.getElementById('field_advisorName').value = policyData.advisorName;
      document.getElementById('field_advisorCode').value = policyData.advisorCode;
    }

    function syncDataFromForm() {
      policyData.planName = document.getElementById('field_planName').value;
      policyData.clientName = document.getElementById('field_clientName').value;
      policyData.age = document.getElementById('field_age').value;
      policyData.terms = document.getElementById('field_terms').value;
      policyData.premium = document.getElementById('field_premium').value;
      policyData.sumAssured = document.getElementById('field_sumAssured').value;
      policyData.regularIncome = document.getElementById('field_regularIncome').value;
      policyData.ga = document.getElementById('field_ga').value;
      policyData.maturity = document.getElementById('field_maturity').value;
      policyData.deathCover = document.getElementById('field_deathCover').value;
      policyData.advisorName = document.getElementById('field_advisorName').value;
      policyData.advisorCode = document.getElementById('field_advisorCode').value;
    }

    function renderSlides() {
      syncDataFromForm();
      const t = i18n[currentLang];
      const wrapper = document.getElementById('slides-wrapper');

      wrapper.innerHTML = `
        <!-- Slide 1 -->
        <div class="slide-card w-full max-w-4xl bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-950 text-white rounded-2xl shadow-2xl p-8 md:p-12 flex flex-col justify-between border border-blue-800">
          <div class="flex justify-between items-center border-b border-blue-800/80 pb-4">
            <span class="bg-amber-400 text-blue-950 text-xs font-black px-2.5 py-1 rounded">LIC OF INDIA</span>
            <span class="text-xs text-amber-300 font-medium">100% Guaranteed Benefits</span>
          </div>
          <div class="my-auto py-6">
            <p class="text-amber-400 text-sm font-semibold uppercase mb-1">${t.coverSubtitle}</p>
            <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-4">${policyData.planName}</h2>
            <div class="bg-blue-900/60 border border-blue-700/60 rounded-xl p-4 inline-block">
              <p class="text-xs text-blue-300">${t.presentedFor}</p>
              <p class="text-xl font-bold text-white">${policyData.clientName} <span class="text-sm font-normal text-amber-300">(${policyData.age} वर्षे)</span></p>
              <p class="text-xs text-slate-300 mt-1">${policyData.terms}</p>
            </div>
          </div>
          <div class="bg-blue-900/90 rounded-lg p-3 flex justify-between items-center text-xs border border-blue-700">
            <div><span class="text-blue-300">${t.advisorLabel}</span> <span class="font-bold text-amber-300">${policyData.advisorName}</span></div>
            <div class="text-blue-200 font-mono">${policyData.advisorCode}</div>
          </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide-card w-full max-w-4xl bg-white text-slate-800 rounded-2xl shadow-xl p-8 md:p-12 flex flex-col justify-between border border-slate-200">
          <div>
            <div class="flex justify-between items-center border-b pb-3 mb-6">
              <div>
                <h3 class="text-2xl font-black text-blue-950">${t.slide2Title}</h3>
                <p class="text-xs text-slate-500">${t.slide2Sub}</p>
              </div>
              <span class="text-xs font-bold bg-blue-100 text-blue-900 px-3 py-1 rounded-full">Slide 2 / 4</span>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-blue-50/70 border border-blue-100 p-4 rounded-xl">
                <span class="text-xs font-semibold text-blue-700">${t.singleInvestment}</span>
                <span class="text-2xl font-black text-blue-950 mt-1 block">${policyData.premium}</span>
              </div>
              <div class="bg-emerald-50/70 border border-emerald-100 p-4 rounded-xl">
                <span class="text-xs font-semibold text-emerald-700">${t.guaranteedIncome}</span>
                <span class="text-2xl font-black text-emerald-900 mt-1 block">${policyData.regularIncome}</span>
              </div>
              <div class="bg-amber-50/70 border border-amber-100 p-4 rounded-xl">
                <span class="text-xs font-semibold text-amber-700">${t.gaBenefit}</span>
                <span class="text-xl font-bold text-amber-950 mt-1 block">${policyData.ga}</span>
              </div>
              <div class="bg-purple-50/70 border border-purple-100 p-4 rounded-xl">
                <span class="text-xs font-semibold text-purple-700">${t.lifeProtection}</span>
                <span class="text-xl font-bold text-purple-950 mt-1 block">${policyData.deathCover}</span>
              </div>
            </div>
          </div>
          <div class="pt-4 border-t flex justify-between text-xs text-slate-400">
            <span>${policyData.advisorName} • ${policyData.advisorCode}</span>
            <span>LIC Benefit Illustration</span>
          </div>
        </div>

        <!-- Slide 3 -->
        <div class="slide-card w-full max-w-4xl bg-white text-slate-800 rounded-2xl shadow-xl p-8 md:p-12 flex flex-col justify-between border border-slate-200">
          <div>
            <div class="flex justify-between items-center border-b pb-3 mb-6">
              <div>
                <h3 class="text-2xl font-black text-blue-950">${t.slide3Title}</h3>
                <p class="text-xs text-slate-500">${t.slide3Sub}</p>
              </div>
              <span class="text-xs font-bold bg-blue-100 text-blue-900 px-3 py-1 rounded-full">Slide 3 / 4</span>
            </div>
            <div class="space-y-4">
              <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-5 rounded-xl shadow-sm">
                <span class="text-xs uppercase font-semibold opacity-90">${t.incomeTimeline}</span>
                <div class="text-3xl font-black mt-1">${policyData.regularIncome}</div>
              </div>
              <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl flex items-center justify-between">
                 <div>
                  <h4 class="font-bold text-blue-950">${t.maturityHeading}</h4>
                  <p class="text-xs text-slate-600">पॉलिसी कालावधी संपल्यावर मिळणारा परतावा</p>
                </div>
                <div class="text-2xl font-extrabold text-blue-900">${policyData.maturity}</div>
              </div>
            </div>
          </div>
          <div class="pt-4 border-t flex justify-between text-xs text-slate-400">
            <span>${policyData.advisorName} • ${policyData.advisorCode}</span>
            <span>Guaranteed by LIC of India</span>
          </div>
        </div>

        <!-- Slide 4 -->
        <div class="slide-card w-full max-w-4xl bg-white text-slate-800 rounded-2xl shadow-xl p-8 md:p-12 flex flex-col justify-between border border-slate-200">
          <div>
            <div class="flex justify-between items-center border-b pb-3 mb-6">
              <div>
                <h3 class="text-2xl font-black text-blue-950">${t.slide4Title}</h3>
                <p class="text-xs text-slate-500">${t.slide4Sub}</p>
              </div>
              <span class="text-xs font-bold bg-blue-100 text-blue-900 px-3 py-1 rounded-full">Slide 4 / 4</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="border border-slate-200 p-5 rounded-xl bg-slate-50">
                <h4 class="font-bold text-base text-blue-900 mb-1">${t.deathBenefitHeading}</h4>
                <div class="text-2xl font-black text-blue-950 mb-2">${policyData.deathCover}</div>
                <p class="text-xs text-slate-600">${t.deathBenefitDesc}</p>
              </div>
              <div class="border border-slate-200 p-5 rounded-xl bg-slate-50">
                <h4 class="font-bold text-base text-emerald-800 mb-1">${t.surrenderHeading}</h4>
                <div class="text-xl font-bold text-emerald-950 mb-2">${policyData.surrenderValue}</div>
                <p class="text-xs text-slate-600">${t.surrenderDesc}</p>
              </div>
            </div>
          </div>
          <div class="pt-4 border-t flex justify-between text-xs text-slate-400">
            <span>${policyData.advisorName} • ${policyData.advisorCode}</span>
            <span>Presentation Generated from Benefit Illustration</span>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function downloadPPTX() {
      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';
      const t = i18n[currentLang];

      const s1 = pptx.addSlide();
      s1.background = { color: '0b192c' };
      s1.addText("LIC OF INDIA", { x: 0.8, y: 0.6, fontSize: 13, bold: true, color: 'f59e0b' });
      s1.addText(policyData.planName, { x: 0.8, y: 1.5, fontSize: 24, bold: true, color: 'ffffff' });
      s1.addText(`${t.presentedFor} ${policyData.clientName} (${policyData.age} yrs)`, { x: 0.8, y: 2.8, fontSize: 16, color: '93c5fd' });
      s1.addText(`${t.advisorLabel} ${policyData.advisorName} | ${policyData.advisorCode}`, { x: 0.8, y: 6.3, fontSize: 11, color: 'fbbf24' });

      const s2 = pptx.addSlide();
      s2.addText(t.slide2Title, { x: 0.8, y: 0.6, fontSize: 22, bold: true, color: '0f172a' });
      s2.addText(`${t.singleInvestment}: ${policyData.premium}`, { x: 0.8, y: 1.8, fontSize: 16, color: '1e40af', bold: true });
      s2.addText(`${t.guaranteedIncome}: ${policyData.regularIncome}`, { x: 0.8, y: 2.8, fontSize: 16, color: '065f46', bold: true });
      s2.addText(`${t.gaBenefit}: ${policyData.ga}`, { x: 0.8, y: 3.8, fontSize: 16, color: '92400e', bold: true });
      s2.addText(`${t.lifeProtection}: ${policyData.deathCover}`, { x: 0.8, y: 4.8, fontSize: 16, color: '6b21a8', bold: true });

      const s3 = pptx.addSlide();
      s3.addText(t.slide3Title, { x: 0.8, y: 0.6, fontSize: 22, bold: true, color: '0f172a' });
      s3.addText(`${t.incomeTimeline}: ${policyData.regularIncome}`, { x: 0.8, y: 2.0, fontSize: 18, color: '059669', bold: true });
      s3.addText(`${t.maturityHeading} ${policyData.maturity}`, { x: 0.8, y: 3.5, fontSize: 18, color: '1e3a8a', bold: true });

      const s4 = pptx.addSlide();
      s4.addText(t.slide4Title, { x: 0.8, y: 0.6, fontSize: 22, bold: true, color: '0f172a' });
      s4.addText(`${t.deathBenefitHeading} ${policyData.deathCover}`, { x: 0.8, y: 2.0, fontSize: 16, color: '1e3a8a', bold: true });
      s4.addText(`${t.surrenderHeading} ${policyData.surrenderValue}`, { x: 0.8, y: 3.5, fontSize: 16, color: '065f46', bold: true });

      pptx.writeFile({ fileName: `LIC_Presentation_${policyData.clientName.replace(/\s+/g, '_')}.pptx` });
    }

    window.onload = function() {
      fillFormWithData();
      renderSlides();
    };
  </script>
</body>
</html>
